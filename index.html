<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registro de Atividades - RDO Elétrica CFS</title>
<style>
* {margin:0; padding:0; box-sizing:border-box; font-family:sans-serif;}
body {background:#eaf2fa; padding:15px; max-width:520px; margin:0 auto; padding-bottom:60px;}

.logo-container {text-align:center; margin-bottom:15px; padding:15px 10px; background:white; border-radius:12px; box-shadow:0 2px 8px rgba(0,85,184,0.1); min-height:120px; display:flex; align-items:center; justify-content:center;}
.logo-img {max-width:220px; width:100%; height:auto;}
.logo-texto {font-size:22px; font-weight:bold; color:#0055b8;}

h1 {color:#0055b8; text-align:center; margin-bottom:15px; font-size:20px;}
.aviso {background:#e6f0fa; border-left:4px solid #0055b8; padding:12px; margin-bottom:15px; border-radius:0 8px 8px 0; font-size:14px; color:#004494;}
.card {background:white; border-radius:12px; padding:20px; margin-bottom:20px; box-shadow:0 2px 10px rgba(0,85,184,0.1);}
label {display:block; margin:12px 0 6px; font-weight:bold; color:#0055b8; font-size:15px;}
input, textarea {width:100%; padding:12px; border:2px solid #b3d1f0; border-radius:8px; font-size:16px; background:#fafcfe;}
input:focus, textarea:focus {outline:none; border-color:#0055b8; background:white;}
textarea {min-height:90px; resize:vertical;}
.nomes {display:flex; flex-wrap:wrap; gap:8px; margin:10px 0;}
.nome-item {background:#e6f0fa; padding:10px 14px; border-radius:20px; display:flex; align-items:center; gap:8px; font-size:15px; color:#0055b8; border:1px solid #b3d1f0;}
.apoio-area {background:#f0f6fc; border:2px solid #b3d1f0; padding:15px; border-radius:8px; margin:15px 0;}
.apoio-opcao {display:flex; align-items:center; gap:10px; margin:8px 0; font-size:15px;}
.apoio-nome {margin:8px 0 8px 28px;}
.foto-preview {margin-top:10px; max-width:100%; border-radius:8px; display:none;}
.foto-container {border:2px dashed #b3d1f0; border-radius:8px; padding:20px; text-align:center; cursor:pointer; margin:10px 0; transition:all 0.2s;}
.foto-container:hover {border-color:#0055b8; background:#eaf2fa;}
.foto-icone {font-size:30px; color:#0055b8;}
button {padding:14px; border:none; border-radius:8px; font-size:17px; font-weight:bold; cursor:pointer; margin-top:10px; transition:opacity 0.2s; width:100%;}
button:hover {opacity:0.9;}
.btn-verde {background:#0055b8; color:white;}
.btn-azul {background:#0077ed; color:white; width:auto; padding:10px 14px; margin:5px 5px 5px 0; font-size:14px;}
.btn-laranja {background:#ff9800; color:white; width:auto; padding:10px 14px; margin:5px 0; font-size:14px;}
.sucesso-planilha {background:#e8f5e9; border-left:4px solid #2e7d32; padding:12px; margin-top:15px; border-radius:0 8px 8px 0; font-size:14px; color:#1b5e20; display:none;}
.rodape {text-align:center; padding:15px; margin-top:20px; font-size:13px; color:#666; border-top:1px solid #ddd;}
</style>
</head>
<body>

<div class="logo-container">
  <img src="logo-forca-sul.jpg" alt="Força Sul Consórcio" class="logo-img" id="minhaLogo">
  <div id="textoFallback" class="logo-texto" style="display:none;">FORÇA SUL<br>Consórcio</div>
</div>

<h1>Registro de Atividades — RDO Elétrica</h1>

<div class="aviso">
  Preencha os dados abaixo. A foto é opcional. Tudo salvo automaticamente na planilha.
</div>

<div class="card">
  <label>1. Seu Nome *</label>
  <input type="text" id="quemEnvia" placeholder="Ex: Cristiano, Rildo...">

  <label>2. Descrição da Atividade *</label>
  <textarea id="desc" placeholder="O que foi feito?"></textarea>

  <label>3. Local *</label>
  <input type="text" id="local" placeholder="Ex: Subestação 2, Painel Principal...">

  <label>4. Data *</label>
  <input type="date" id="data">

  <label>5. Apoio de Outras Áreas</label>
  <div class="apoio-area">
    <label class="apoio-opcao">
      <input type="checkbox" id="apoioMecanica" onchange="mostrarCamposApoio()"> Apoio da Mecânica
    </label>
    <div id="nomeMecanicaArea" class="apoio-nome" style="display:none;">
      <input type="text" id="nomeMecanica" placeholder="Nome da pessoa da Mecânica">
    </div>

    <label class="apoio-opcao">
      <input type="checkbox" id="apoioCivil" onchange="mostrarCamposApoio()"> Apoio da Civil
    </label>
    <div id="nomeCivilArea" class="apoio-nome" style="display:none;">
      <input type="text" id="nomeCivil" placeholder="Nome da pessoa da Civil">
    </div>
  </div>

  <label>6. Participantes da Equipe *</label>
  <button type="button" class="btn-azul" onclick="marcarTudo()">Marcar Todos</button>
  <button type="button" class="btn-azul" onclick="desmarcarTudo()">Desmarcar Todos</button>
  
  <div class="adicionar-area" style="margin-top:10px;">
    <input type="text" id="novoColaborador" placeholder="Adicionar nome...">
    <button type="button" class="btn-laranja" onclick="adicionarColaborador()">Adicionar</button>
  </div>
  
  <div class="nomes" id="listaNomes"></div>

  <label>7. Foto da Atividade (opcional)</label>
  <div class="foto-container" onclick="document.getElementById('fotoInput').click()">
    <div class="foto-icone">📷</div>
    <p style="margin-top:8px; color:#0055b8; font-size:14px;">Clique para tirar ou escolher foto</p>
    <input type="file" id="fotoInput" accept="image/*" capture="environment" style="display:none;" onchange="processarFoto(this)">
  </div>
  <img id="fotoPreview" class="foto-preview" alt="Pré-visualização da foto">
  <p id="nomeFoto" style="margin-top:5px; font-size:13px; color:#666; display:none;"></p>

  <button class="btn-verde" onclick="montarESalvar()" style="margin-top:20px;">✅ SALVAR REGISTRO</button>

  <div id="sucessoPlanilha" class="sucesso-planilha">
    ✅ Salvo com sucesso! Pode fazer o próximo registro.
  </div>

  <button class="btn-verde" style="background:#ff9800; margin-top:15px; display:none;" id="btnNovo" onclick="novoLancamento()">📝 NOVO REGISTRO</button>
</div>

<div class="rodape">
  Força Sul Consórcio — Registro Diário de Operação<br>
  <span style="font-size:11px; color:#999;">v2.0</span>
</div>

<script>
// ✅ LINK DO SEU APPS SCRIPT
const URL_APPS_SCRIPT = "https://script.google.com/macros/s/AKfycbzSRSrHHPEciCGa0cT20wcyAMLhY6HnbZ2YMew__RfdKB7IoTK5EQtqlPElhkZMTzZrYw/exec";

let fotoBase64 = null;
let fotoNome = null;

let colaboradores = [
  "Arlan", "Chrystian", "Cleber", "Cristiano", "Elias", "Herberson",
  "Jackson", "Jaudecy", "Juracy", "Lázaro", "Maicon", "Marcelo",
  "Matheus", "Rafael", "Rildo", "Steve"
];

function mostrarCamposApoio() {
  document.getElementById('nomeMecanicaArea').style.display = 
    document.getElementById('apoioMecanica').checked ? 'block' : 'none';
  document.getElementById('nomeCivilArea').style.display = 
    document.getElementById('apoioCivil').checked ? 'block' : 'none';
}

function carregarListaNomes() {
  const lista = document.getElementById('listaNomes');
  lista.innerHTML = '';
  colaboradores.sort((a, b) => a.localeCompare(b, 'pt-BR'));
  colaboradores.forEach(nome => {
    const label = document.createElement('label');
    label.className = 'nome-item';
    label.innerHTML = `<input type="checkbox" class="chk-equipe" value="${nome}"> ${nome}`;
    lista.appendChild(label);
  });
}

function adicionarColaborador() {
  const input = document.getElementById('novoColaborador');
  const nome = input.value.trim();
  if (!nome) { alert('Digite um nome!'); return; }
  if (colaboradores.includes(nome)) { alert('Nome já está na lista!'); input.value=''; return; }
  colaboradores.push(nome);
  carregarListaNomes();
  input.value = '';
  alert(`${nome} adicionado!`);
}

function marcarTudo(){
  document.querySelectorAll('.chk-equipe').forEach(c => c.checked = true);
}
function desmarcarTudo(){
  document.querySelectorAll('.chk-equipe').forEach(c => c.checked = false);
}

function processarFoto(input) {
  const arquivo = input.files[0];
  if (!arquivo) return;
  
  fotoNome = `${Date.now()}_${arquivo.name}`;
  
  const leitor = new FileReader();
  leitor.onload = function(e) {
    const img = new Image();
    img.onload = function() {
      // Reduzir tamanho para enviar mais rápido
      const canvas = document.createElement('canvas');
      const MAX = 1200;
      let w = img.width, h = img.height;
      if (w > h && w > MAX) { h *= MAX/w; w = MAX; }
      else if (h > MAX) { w *= MAX/h; h = MAX; }
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      fotoBase64 = canvas.toDataURL('image/jpeg', 0.7).split(',')[1];
      
      // Mostrar pré-visualização
      document.getElementById('fotoPreview').src = e.target.result;
      document.getElementById('fotoPreview').style.display = 'block';
      document.getElementById('nomeFoto').textContent = `✅ Foto: ${arquivo.name}`;
      document.getElementById('nomeFoto').style.display = 'block';
    };
    img.src = e.target.result;
  };
  leitor.readAsDataURL(arquivo);
}

function formatarData(dataISO){
  const d = new Date(dataISO + 'T00:00:00');
  return String(d.getDate()).padStart(2,'0') + '/' + String(d.getMonth()+1).padStart(2,'0') + '/' + d.getFullYear();
}

async function montarESalvar(){
  const quem = document.getElementById('quemEnvia').value.trim();
  const desc = document.getElementById('desc').value.trim();
  const local = document.getElementById('local').value.trim();
  const data = document.getElementById('data').value;
  const apoioMec = document.getElementById('apoioMecanica').checked;
  const apoioCiv = document.getElementById('apoioCivil').checked;
  const nomeMec = document.getElementById('nomeMecanica').value.trim();
  const nomeCiv = document.getElementById('nomeCivil').value.trim();
  const participantesEquipe = Array.from(document.querySelectorAll('.chk-equipe:checked')).map(c => c.value);

  if(!quem){ alert('Digite seu nome!'); return; }
  if(!desc){ alert('Descreva a atividade!'); return; }
  if(!local){ alert('Digite o local!'); return; }
  if(!data){ alert('Selecione a data!'); return; }
  if(participantesEquipe.length === 0){ alert('Selecione pelo menos um participante!'); return; }

  const dataFormatada = formatarData(data);
  
  let textoApoio = 'Não houve apoio de outras áreas';
  if (apoioMec && apoioCiv) {
    textoApoio = 'Apoio da Mecânica' + (nomeMec ? ': ' + nomeMec : '') + 
                 ' e da Civil' + (nomeCiv ? ': ' + nomeCiv : '');
  } else if (apoioMec) {
    textoApoio = 'Apoio da Mecânica' + (nomeMec ? ': ' + nomeMec : '');
  } else if (apoioCiv) {
    textoApoio = 'Apoio da Civil' + (nomeCiv ? ': ' + nomeCiv : '');
  }

  const dadosParaPlanilha = {
    quem: quem,
    descricao: desc,
    local: local,
    data: dataFormatada,
    apoio: textoApoio,
    nomeMecanica: nomeMec || '-',
    nomeCivil: nomeCiv || '-',
    participantes: participantesEquipe.join(', '),
    fotoBase64: fotoBase64,
    fotoNome: fotoNome
  };

  try {
    await fetch(URL_APPS_SCRIPT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(dadosParaPlanilha)
    });
    
    document.getElementById('sucessoPlanilha').style.display = 'block';
    document.getElementById('btnNovo').style.display = 'block';
  } catch (erro) {
    alert('Erro ao salvar: ' + erro.message);
  }
}

function novoLancamento(){
  document.getElementById('quemEnvia').value = '';
  document.getElementById('desc').value = '';
  document.getElementById('local').value = '';
  document.getElementById('data').value = '';
  document.getElementById('apoioMecanica').checked = false;
  document.getElementById('apoioCivil').checked = false;
  document.getElementById('nomeMecanica').value = '';
  document.getElementById('nomeCivil').value = '';
  document.getElementById('nomeMecanicaArea').style.display = 'none';
  document.getElementById('nomeCivilArea').style.display = 'none';
  document.querySelectorAll('.chk-equipe').forEach(c => c.checked = false);
  document.getElementById('fotoInput').value = '';
  document.getElementById('fotoPreview').style.display = 'none';
  document.getElementById('nomeFoto').style.display = 'none';
  fotoBase64 = null;
  fotoNome = null;
  document.getElementById('sucessoPlanilha').style.display = 'none';
  document.getElementById('btnNovo').style.display = 'none';
  window.scrollTo({top:0, behavior:'smooth'});
}

document.getElementById('data').valueAsDate = new Date();
carregarListaNomes();
</script>

</body>
</html>
